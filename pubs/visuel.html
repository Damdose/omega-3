<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Visuels des annonces Meta</title>
<!-- Gabarit des visuels publicitaires : visuel.html?v=pro|public&f=carre|story, rendu en PNG par Playwright -->
<style>
@font-face { font-family: 'Albert Sans'; src: url('../assets/fonts/albertsans.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'IBM Plex Mono'; src: url('../assets/fonts/ibmplexmono-400.woff2') format('woff2'); font-weight: 400; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Albert Sans', sans-serif; font-weight: 300; letter-spacing: -0.02em; }
body.story { height: 1920px; }
.page { position: relative; width: 100%; height: 100%; padding: 72px; display: flex; flex-direction: column; }
.nuit { background: #0B1D2E; color: #fff; }
.nuit::before { content: ''; position: absolute; inset: 0; background: radial-gradient(55% 45% at 90% 8%, rgba(77,168,181,.35), transparent 70%), radial-gradient(50% 40% at 0% 100%, rgba(77,168,181,.18), transparent 70%); }
.sable { background: #F5F4F0; color: #0B1D2E; }
.page > * { position: relative; }
.oeil { display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; font-size: 30px; font-weight: 400; padding: 10px 20px; border-radius: 10px; }
.oeil::before { content: ''; width: 12px; height: 12px; transform: rotate(45deg); }
.nuit .oeil { background: rgba(255,255,255,.94); color: #0B1D2E; } .nuit .oeil::before { background: #0B1D2E; }
.sable .oeil { background: #0B1D2E; color: #fff; } .sable .oeil::before { background: #fff; }
h1 { font-weight: 300; font-size: 96px; line-height: 1.02; margin-top: 40px; }
h1 em { font-style: normal; color: #5BBFCB; }
.sable h1 em { color: #3D8691; }
.sous { font-size: 36px; line-height: 1.3; margin-top: 28px; max-width: 24ch; opacity: .82; }
.photo { flex: 1; margin-top: 48px; border-radius: 28px; overflow: hidden; position: relative; min-height: 0; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; left: 28px; bottom: 28px; background: #fff; color: #0B1D2E; border-radius: 999px; padding: 16px 28px; font-size: 30px; font-weight: 400; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); display: flex; align-items: center; gap: 14px; }
.badge b { color: #3D8691; font-weight: 500; }
ul { list-style: none; display: grid; gap: 18px; margin-top: 44px; font-size: 34px; }
li { display: flex; align-items: center; gap: 20px; }
li::before { content: '✓'; flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; background: #4DA8B5; color: #0B1D2E; display: grid; place-items: center; font-size: 26px; font-weight: 600; }
.pied { display: flex; align-items: center; justify-content: space-between; margin-top: 48px; padding-top: 32px; border-top: 1px solid currentColor; border-color: rgba(127,140,155,.35); font-size: 26px; }
.pied img { height: 44px; width: auto; }
.mono { font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0; opacity: .7; text-transform: uppercase; }
.produits { flex: 1; margin-top: 40px; position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 0; min-height: 0; }
.produits img { height: 100%; max-height: 560px; width: auto; object-fit: contain; filter: drop-shadow(0 30px 40px rgba(11,29,46,.25)); }
.produits img.p2 { margin-left: -90px; max-height: 470px; }
.produits img.p3 { margin-left: -70px; max-height: 420px; }
.mention { font-size: 22px; margin-top: 24px; opacity: .6; }
.story .page { padding: 120px 80px 260px; }
.story h1 { font-size: 112px; }
</style>
</head>
<body>
<div id="racine"></div>
<script>
var q = new URLSearchParams(location.search), v = q.get('v') || 'pro', f = q.get('f') || 'carre';
if (f === 'story') document.body.classList.add('story');
var pied = function (blanc) { return '<div class="pied"><img src="../assets/' + (blanc ? 'v2/eqology-logo-blanc.png' : 'images/eqology-logo.png') + '" alt=""><span class="mono">Distributeur indépendant Eqology</span></div>'; };
var html = v === 'pro'
  ? '<div class="page nuit"><span class="oeil">Praticiens de santé et coachs sportifs</span>'
    + '<h1>Proposez Eqology <em>à vos patients et à vos sportifs.</em></h1>'
    + '<p class="sous">Un test sanguin à domicile, des oméga‑3 de Norvège, une commission sur leurs commandes.</p>'
    + '<div class="photo"><img src="../assets/v2/praticienne.webp" style="object-position:50% 30%"><span class="badge">Kit de bienvenue de <b>99&nbsp;€ remboursé</b></span></div>'
    + '<ul><li>Rien à vendre, aucun stock</li><li>Ils commandent seuls avec votre lien</li></ul>'
    + pied(true) + '</div>'
  : '<div class="page sable"><span class="oeil">Partenariat Eqology</span>'
    + '<h1>Un complément de revenus <em>avec les oméga‑3 Eqology.</em></h1>'
    + '<p class="sous">Vos proches commandent avec votre lien. Eqology encaisse, livre et vous verse une commission.</p>'
    + '<div class="produits"><img src="../assets/v2/produits/pure-arctic-oil.webp"><img class="p2" src="../assets/v2/produits/omega-3-test-kit.webp"><img class="p3" src="../assets/v2/produits/pure-vegan-oil.webp"></div>'
    + '<ul><li>Sans stock ni livraison</li><li>À votre rythme, depuis chez vous</li><li>Kit de bienvenue de 99&nbsp;€ remboursé</li></ul>'
    + '<p class="mention">Aucun revenu n’est garanti. Le plan de rémunération officiel vous est présenté avant tout engagement.</p>'
    + pied(false) + '</div>';
document.getElementById('racine').innerHTML = html;
document.getElementById('racine').style.height = '100%';
</script>
</body>
</html>
