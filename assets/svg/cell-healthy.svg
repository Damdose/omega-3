<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Healthy cell membrane — soft, permeable -->
  <rect width="400" height="400" rx="24" fill="#eef8f9"/>
  <!-- Cell body -->
  <ellipse cx="200" cy="200" rx="120" ry="110" fill="#d5eff2" stroke="#4DA8B5" stroke-width="3"/>
  <!-- Flexible membrane waves -->
  <path d="M80 200 Q100 180 120 200 Q140 220 160 200 Q180 180 200 200 Q220 220 240 200 Q260 180 280 200 Q300 220 320 200" stroke="#4DA8B5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M80 200 Q100 220 120 200 Q140 180 160 200 Q180 220 200 200 Q220 180 240 200 Q260 220 280 200 Q300 180 320 200" stroke="#81cfd8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Nucleus -->
  <circle cx="200" cy="195" r="35" fill="#4DA8B5" opacity="0.3"/>
  <circle cx="200" cy="195" r="20" fill="#4DA8B5" opacity="0.5"/>
  <!-- Nutrients entering (arrows in) -->
  <g stroke="#0B1D2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="150" x2="95" y2="170"/>
    <polyline points="88,162 95,170 86,173"/>
    <line x1="55" y1="220" x2="90" y2="210"/>
    <polyline points="83,217 90,210 84,205"/>
    <line x1="70" y1="260" x2="100" y2="240"/>
    <polyline points="93,247 100,240 92,237"/>
  </g>
  <!-- Waste exiting (arrows out) -->
  <g stroke="#0B1D2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4">
    <line x1="305" y1="165" x2="340" y2="150"/>
    <polyline points="332,155 340,150 335,158"/>
    <line x1="310" y1="230" x2="340" y2="240"/>
    <polyline points="333,233 340,240 332,242"/>
  </g>
  <!-- Small nutrient dots -->
  <circle cx="75" cy="155" r="4" fill="#4DA8B5"/>
  <circle cx="68" cy="225" r="3" fill="#4DA8B5"/>
  <circle cx="80" cy="265" r="3.5" fill="#4DA8B5"/>
  <!-- Label -->
  <text x="200" y="350" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="600" fill="#0B1D2E">Cellule saine</text>
  <text x="200" y="370" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" fill="#0B1D2E" opacity="0.5">Membrane souple et perméable</text>
</svg>
