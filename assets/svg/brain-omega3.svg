<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="24" fill="#eef8f9"/>
  <!-- Brain outline -->
  <g transform="translate(160,40)">
    <!-- Left hemisphere -->
    <path d="M140 30 Q60 30 40 80 Q15 140 30 200 Q40 240 70 270 Q100 300 140 310" fill="#d5eff2" stroke="#4DA8B5" stroke-width="2.5"/>
    <!-- Right hemisphere -->
    <path d="M140 30 Q220 30 240 80 Q265 140 250 200 Q240 240 210 270 Q180 300 140 310" fill="#abdfe5" stroke="#4DA8B5" stroke-width="2.5"/>
    <!-- Brain folds -->
    <path d="M80 80 Q110 65 140 80" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M60 130 Q100 115 140 130" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M50 180 Q95 165 140 180" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M65 230 Q100 215 140 230" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M200 80 Q170 65 140 80" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M220 130 Q180 115 140 130" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M230 180 Q185 165 140 180" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M215 230 Q178 215 140 230" stroke="#4DA8B5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Center line -->
    <line x1="140" y1="30" x2="140" y2="310" stroke="#4DA8B5" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <!-- Cerebellum -->
    <ellipse cx="140" cy="290" rx="45" ry="25" fill="#81cfd8" stroke="#4DA8B5" stroke-width="2" opacity="0.6"/>
    <!-- Brain stem -->
    <rect x="132" y="300" width="16" height="30" rx="8" fill="#81cfd8" stroke="#4DA8B5" stroke-width="1.5"/>
  </g>
  <!-- 60-70% lipids annotation -->
  <g transform="translate(430, 80)">
    <text font-family="Space Grotesk, Georgia, serif" font-size="42" font-weight="700" fill="#0B1D2E">60-70%</text>
    <text y="28" font-family="DM Sans, sans-serif" font-size="14" fill="#0B1D2E" opacity="0.5">de lipides</text>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#4DA8B5" stroke-width="2" opacity="0.3"/>
    <text y="60" font-family="DM Sans, sans-serif" font-size="12" fill="#4DA8B5">dont oméga-3 (DHA)</text>
  </g>
  <!-- Eye / retina annotation -->
  <g transform="translate(430, 200)">
    <circle cx="20" cy="15" r="16" fill="none" stroke="#4DA8B5" stroke-width="2"/>
    <circle cx="20" cy="15" r="7" fill="#4DA8B5" opacity="0.3"/>
    <circle cx="20" cy="15" r="3" fill="#0B1D2E"/>
    <text x="48" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#0B1D2E" dominant-baseline="middle">Rétine</text>
    <text x="48" y="18" font-family="DM Sans, sans-serif" font-size="11" fill="#0B1D2E" opacity="0.5">DHA essentiel</text>
  </g>
  <!-- Connector lines -->
  <line x1="380" y1="160" x2="430" y2="100" stroke="#4DA8B5" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="370" y1="210" x2="430" y2="210" stroke="#4DA8B5" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
</svg>
